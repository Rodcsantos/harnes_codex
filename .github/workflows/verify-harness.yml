name: verify-harness

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate shell and Python syntax
        run: |
          for f in scripts/*.sh specialists/install.sh specialists/uninstall.sh; do bash -n "$f"; done
          python3 -m py_compile hooks/*.py scripts/*.py specialists/verify.py

      - name: Validate agents and skills
        run: python3 specialists/verify.py specialists

      - name: Claude agents in sync with TOML sources
        run: python3 scripts/build-claude-agents.py --check

      - name: Validate manifest against the tree
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("specialists")
          manifest = json.loads((root / "manifest.json").read_text())
          skills = {p.name for p in (root / "skills").iterdir() if p.is_dir()}
          agents = {p.name for p in (root / "agents").glob("*.toml")}

          assert set(manifest["skills"]) == skills, set(manifest["skills"]) ^ skills
          assert set(manifest["agents"]) == agents, set(manifest["agents"]) ^ agents
          for s in skills:
              assert (root / "skills" / s / "SKILL.md").is_file(), s
              assert (root / "skills" / s / "agents" / "openai.yaml").is_file(), s
          required = {"tech-lead", "explorer", "architect", "test-engineer", "verifier",
                      "reviewer", "security-reviewer"}
          assert required <= {a[:-5] for a in agents}, required - {a[:-5] for a in agents}
          json.loads(Path("config/mcp.claude.example.json").read_text())
          print(f"OK: {len(agents)} agents, {len(skills)} skills, manifest in sync")
          PY

      - name: Hook tests
        run: python3 -m unittest discover -s tests -v
