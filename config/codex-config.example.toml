#:schema https://developers.openai.com/codex/config-schema.json
# Example only. Merge deliberately into ~/.codex/config.toml.

[agents]
enabled = true
# Multi-agent work multiplies context. Three concurrent subagents covers most
# useful parallel exploration without opening eight independent contexts.
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "low"

# Memories are intentionally not forced on by the harness. Enable them only
# when persistent cross-session context has measured value for your workflow.
# [features]
# memories = true
#
# [memories]
# generate_memories = true
# use_memories = true

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

# Keep secrets in environment variables, never in this file.
# Browser automation for UI verification (enable only in projects that need it).
[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]
