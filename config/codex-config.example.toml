# Example only. Merge deliberately into ~/.codex/config.toml.

[agents]
enabled = true
max_concurrent_threads_per_session = 8
default_subagent_model = "gpt-5.6"
default_subagent_reasoning_effort = "medium"

[features]
memories = true

[memories]
generate_memories = true
use_memories = true

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

# Keep secrets in environment variables, never in this file.
# Browser automation for UI verification (enable only in projects that need it).
[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]
